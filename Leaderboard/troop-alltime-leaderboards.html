<!-- ================================================================
  Troop All-Time Leaderboards — TroopWebHost Custom Page
  ================================================================
  HOW TO INSTALL
  1. Log into TroopWebHost as an admin.
  2. Home menu → Manage Custom Pages → Add New Custom Page.
  3. Paste this entire file into the page's HTML/content box and save.
  4. Add it to a menu everyone (scouts, parents, leaders) can see.

  DATA SOURCES
  - ACTIVE members, 6 of 7 categories (everything except Merit
    Badges): always fetched LIVE on every page load from the Event
    Participation Summary report. No admin step needed; works for any
    role granted "View Event Participation Reports".
  - MERIT BADGES (both Active and Former): not every viewer has access
    to a live source for this — permissions on the widget/report that
    could provide it live aren't consistent across roles. So Merit
    Badges, for everyone, comes exclusively from the admin-published
    data described below.
  - IMPORTANT: the Event Participation Summary report has no active/
    former field of its own — it lists everyone with event history in
    the date range, including people who've since left. The Active
    tabs cross-reference against the published Former list to exclude
    them. Until a Former list has been published at least once,
    departed members who attended events may still appear on Active
    leaderboards — publishing (or republishing after new departures)
    fixes this.
  - FORMER members, other 6 categories: also not available live —
    only the roster export tracks who's left. Restricted to the same
    admin action as Merit Badges.
  The "Publish former member data" panel at the bottom of this page
  pulls ONLY name + the metric values it needs (nothing else — no
  addresses, medical info, etc.) from that export, for former members
  in general plus active scouts' Merit Badges specifically.

  Active/Former/All tabs merge these two sources — Active is always
  current, Former only updates when an admin republishes it.

  HOW TO PUBLISH/REFRESH FORMER MEMBER DATA
  1. Open this page while logged in as someone with roster-export
     access.
  2. Scroll down, open "Admin: Publish former member data".
  3. Click "Generate" (this takes a few seconds — it pulls two
     reports).
  4. Copy the code block it shows you, OR click "Save this to the
     page now" to publish it automatically.
  5. If copying manually: edit this Custom Page, replace the existing
     FORMER_SNAPSHOT_DATE / FORMER_SNAPSHOT_DATA lines near the top of
     the script with what you copied, and save.
  Repeat whenever you want it refreshed — there's no automatic
  schedule.

  CONFIRM BEFORE USE
  MENU_ITEM_ID / FORM_ID values below match this troop's site as
  captured. If any report ever differs on your site, open it once
  yourself and check the IDs in its URL.
================================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
(function () {
  // ---- CONFIGURE THIS ------------------------------------------------
  var MENU_ITEM_ID = "46097"; // Event Participation Summary For Date Range
  var FORM_ID_DATE_SUBMIT = "2775";
  var FORM_ID_REPORT = "2776";
  var RECORD_ID = "1";
  var RECORD_FK = "0";
  var DATE_FIELD_START = "5697516";
  var DATE_FIELD_END = "5697616";

  var START_DATE = "01/01/2000";
  var today = new Date();
  var END_DATE = (today.getMonth() + 1) + "/" + today.getDate() + "/" + today.getFullYear();

  var DATE_SUBMIT_URL = "FormDetail.aspx";
  var EVENT_REPORT_URL = "FormReportMultiSection.aspx?Menu_Item_ID=" + MENU_ITEM_ID +
    "&Form_ID=" + FORM_ID_REPORT + "&Stack=2&ID=" + RECORD_ID + "&FK=" + RECORD_FK + "&ReportFormat=XLS";

  // Merit Badge counts for active scouts now come from a live "Data
  // Window - Membership - Active Scouts" WIDGET (server-rendered
  // straight into a Custom Page's HTML, Name/Earned/In Progress
  // columns) rather than parsing the Merit Badge History report file
  // — simpler and avoids a report-export round trip. This reuses the
  // "Leaderboard-Test" page created while testing widgets; point these
  // at wherever that widget actually lives on your site (it can be a
  // small, unlisted page — it doesn't need to be in any menu).
  // Merit Badges are sourced entirely from the admin-published data
  // below (both Active and Former) — not everyone has access to the
  // widget that could otherwise provide this live, and the only other
  // source (Export Roster to Excel) contains sensitive PII, so it
  // stays admin-only rather than depending on per-viewer permissions.

  // Export Roster to Excel — the ONLY report that tracks former
  // members and their status. Contains sensitive PII (addresses,
  // medical info, etc.), so it should stay leader-only. Only used by
  // the admin snapshot panel below, never fetched for regular viewers.
  var ROSTER_MENU_ITEM_ID = "45897";
  var ROSTER_REPORT_URL = "FormReport.aspx?Menu_Item_ID=" + ROSTER_MENU_ITEM_ID + "&Stack=1&ReportFormat=XLS";

  // Event report column layout confirmed against a real export
  // (0-indexed, header:1 rows): col0 = row type ("Scout"/"Adult"),
  // col1 = Name, col4 = Camping Nights, col6 = Service Hours,
  // col9 = Hiking Miles, col11 = Backpacking Miles, col12 = Cycling
  // Miles, col13 = Paddling Miles.
  var CATEGORIES = [
    { key: "Camping Nights",    label: "Camping Nights",    unit: "nights", col: 4,  rosterCol: "Camping Nights" },
    { key: "Hiking Miles",      label: "Hiking Miles",      unit: "mi",     col: 9,  rosterCol: "Total Hiking Miles" },
    { key: "Service Hours",     label: "Service Hours",     unit: "hrs",    col: 6,  rosterCol: "Total Service Hours" },
    { key: "Backpacking Miles", label: "Backpacking Miles", unit: "mi",     col: 11 },
    { key: "Cycling Miles",     label: "Cycling Miles",     unit: "mi",     col: 12 },
    { key: "Paddling Miles",    label: "Paddling Miles",    unit: "mi",     col: 13 },
    { key: "Merit Badges",      label: "Merit Badges",      unit: "badges", source: "meritbadge", rosterCol: "Merit Badges" }
  ];
  var NAME_COL = 1;
  var ROW_TYPE_COL = 0;
  var GROUPS = [
    { key: "Scout", label: "Scouts" },
    { key: "Adult", label: "Adults" }
  ];
  var STATUS_OPTIONS = [
    { key: "All", label: "All" },
    { key: "Active", label: "Active" },
    { key: "Former", label: "Former" }
  ];

  // --- PUBLISHED SNAPSHOT ------------------------------------------------
  // Paste admin-generated snapshot code here to unlock Active/Former
  // tabs and include former members across every category. Leave both
  // null to use the live, active-members-only fetch instead.
  // Paste admin-generated code here to publish former-member data.
  // Only Former-status records matter from this — Active data always
  // comes from the live fetch above regardless of what's here. Leave
  // both null until an admin has published at least once.
  var FORMER_SNAPSHOT_DATE = null; // e.g. "8/13/2026, 10:02:00 AM"
  var FORMER_SNAPSHOT_DATA = null; // e.g. [{ "name": "...", "group": "Scout", "status": "Former", "values": { "Camping Nights": 51, ... } }, ...]
  // ---------------------------------------------------------------------

  // --- SELF-SAVE (optional) ----------------------------------------------
  // Lets the admin panel write a refreshed FORMER_SNAPSHOT_DATE/FORMER_SNAPSHOT_DATA
  // directly back into this Custom Page's saved source, instead of
  // copy/pasting manually. Menu_Item_ID and Custom_Form_ID are read
  // automatically from this page's own URL. SELF_SECTION_ID cannot be
  // auto-detected — it identifies which content block on this Custom
  // Page holds this script. Get it once by watching the browser's
  // Network tab (or asking Claude with a HAR capture) while manually
  // editing/saving this page, and searching the save request for
  // "SelectedSectionID". If this page's content is ever recreated in a
  // new section, update this value — saving to the wrong section ID
  // would overwrite the WRONG content block.
  var SELF_FORM_ID = "7323";        // TroopWebHost's custom-section editor form
  var SELF_SECTION_ID = "148";      // confirm this matches YOUR page's section
  // ---------------------------------------------------------------------

  var statusTabsEl = document.getElementById('twl-status-tabs');
  var groupTabsEl = document.getElementById('twl-group-tabs');
  var tabsEl = document.getElementById('twl-tabs');
  var bodyEl = document.getElementById('twl-body');
  var stateEl = document.getElementById('twl-state');
  var subtitleEl = document.getElementById('twl-subtitle');
  var footerEl = document.getElementById('twl-footer');
  var adminSlotEl = document.getElementById('twl-admin-slot');

  var leaderboards = {}; // group -> status -> category -> [{name, value}]
  var activeGroup = GROUPS[0].key;
  var activeStatus = 'All';
  var activeKey = CATEGORIES[0].key;
  var formerDataAvailable = !!FORMER_SNAPSHOT_DATA;
  var hasAdminAccess = false; // set before first render — see boot sequence

  function setState(msg, isError) {
    statusTabsEl.style.display = 'none';
    groupTabsEl.style.display = 'none';
    tabsEl.style.display = 'none';
    bodyEl.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'twl-state' + (isError ? ' twl-error' : '');
    div.textContent = msg;
    bodyEl.appendChild(div);
  }

  function emptyLeaderboardShell() {
    var result = {};
    GROUPS.forEach(function (g) {
      result[g.key] = {};
      STATUS_OPTIONS.forEach(function (s) {
        result[g.key][s.key] = {};
        CATEGORIES.forEach(function (cat) { result[g.key][s.key][cat.key] = []; });
      });
    });
    return result;
  }

  function sortAll(result) {
    GROUPS.forEach(function (g) {
      STATUS_OPTIONS.forEach(function (s) {
        CATEGORIES.forEach(function (cat) {
          result[g.key][s.key][cat.key].sort(function (a, b) { return b.value - a.value; });
        });
      });
    });
    return result;
  }

  // ---- LIVE MODE (active members only; status tabs stay hidden) -----

  function submitDateRange() {
    var fd = new FormData();
    fd.append('menuopenflag', 'N');
    fd.append('Selected_Action', 'save');
    fd.append('Hover_Action', '');
    fd.append('Selected_Button_ID', 'BUTTON3');
    fd.append('Menu_Item_ID', MENU_ITEM_ID);
    fd.append('Form_ID', FORM_ID_DATE_SUBMIT);
    fd.append('Link_To_Menu_Item_ID', '');
    fd.append('Pass', '1');
    fd.append('Stack', '2');
    fd.append('NextSectionPageNumber', '');
    fd.append('NewRowsPerPage', '');
    fd.append('ChildRowID', '0');
    fd.append('Report_Format', 'XLS');
    fd.append('Current_URL', location.origin + '/FormDetail.aspx?Menu_Item_ID=' + MENU_ITEM_ID + '&Stack=2');
    fd.append('Page_Layout', '1');
    fd.append('Report_option', '2');
    fd.append('FK', RECORD_FK);
    fd.append('ID', RECORD_ID);
    fd.append('RVALENTRY' + DATE_FIELD_START, 'Y');
    fd.append('OLD' + DATE_FIELD_START, START_DATE);
    fd.append('ENTRY' + DATE_FIELD_START, START_DATE);
    fd.append('RVALENTRY' + DATE_FIELD_END, 'Y');
    fd.append('OLD' + DATE_FIELD_END, END_DATE);
    fd.append('ENTRY' + DATE_FIELD_END, END_DATE);
    fd.append('FirstControl', 'ENTRY' + DATE_FIELD_START);

    return fetch(DATE_SUBMIT_URL, { method: 'POST', credentials: 'include', body: fd })
      .then(function (res) {
        if (!res.ok) throw new Error('Date range submission failed (' + res.status + ').');
        return res;
      });
  }

  function fetchEventWorkbook() {
    return fetch(EVENT_REPORT_URL, { credentials: 'include' })
      .then(function (res) {
        if (!res.ok) throw new Error('Event report request failed (' + res.status + ').');
        return res.arrayBuffer();
      })
      .then(function (buf) {
        if (typeof XLSX === 'undefined') throw new Error('XLSX parsing library failed to load.');
        return XLSX.read(buf, { type: 'array' });
      });
  }

  function eventWorkbookRows(workbook) {
    var sheet = workbook.Sheets[workbook.SheetNames[0]];
    return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  }

  function buildFormerNameSet(data) {
    var set = {};
    (data || []).forEach(function (rec) {
      if (rec.status === 'Former') set[rec.name] = true;
    });
    return set;
  }

  function addLiveDataToActive(result, workbook, formerNames) {
    var rows = eventWorkbookRows(workbook);

    rows.forEach(function (row) {
      if (!row) return;
      var rowType = row[ROW_TYPE_COL];
      if (!result[rowType]) return;
      var name = row[NAME_COL];
      if (!name) return;
      // The event report has no active/former field of its own — it
      // just lists everyone with participation history in the date
      // range, including people who've since left. Cross-reference
      // against the published Former list (when available) to exclude
      // them from Active.
      if (formerNames && formerNames[name]) return;

      CATEGORIES.forEach(function (cat) {
        if (cat.source === 'meritbadge') return; // sourced from the admin snapshot instead — see addSnapshotDataToLeaderboards
        var val = parseFloat(row[cat.col]);
        if (isNaN(val) || val <= 0) return;
        result[rowType]['Active'][cat.key].push({ name: name, value: val });
      });
    });
  }

  // ---- ADMIN-PUBLISHED DATA, merged with live Active -----------------
  // Most categories only take Former-status records from here (Active
  // already comes from the live fetch above). Merit Badges is the one
  // exception: not every viewer has access to a live source for it, so
  // BOTH Active and Former merit badge counts come from here instead.

  function addSnapshotDataToLeaderboards(result, data) {
    if (!data) return;
    data.forEach(function (rec) {
      if (!result[rec.group]) return;
      var bucket = rec.status === 'Active' ? 'Active' : 'Former';
      CATEGORIES.forEach(function (cat) {
        if (bucket === 'Active' && cat.key !== 'Merit Badges') return; // avoid duplicating live-sourced categories
        var val = rec.values ? rec.values[cat.key] : undefined;
        if (typeof val !== 'number' || val <= 0) return;
        result[rec.group][bucket][cat.key].push({ name: rec.name, value: val });
      });
    });
  }

  function fillAllFromActiveAndFormer(result) {
    GROUPS.forEach(function (g) {
      CATEGORIES.forEach(function (cat) {
        result[g.key]['All'][cat.key] = result[g.key]['Active'][cat.key].concat(result[g.key]['Former'][cat.key]);
      });
    });
  }

  // ---- Rendering ------------------------------------------------------

  function formatVal(v) {
    return (Math.round(v * 100) / 100).toString();
  }

  function renderStatusTabs() {
    statusTabsEl.innerHTML = '';
    statusTabsEl.style.display = 'flex';
    STATUS_OPTIONS.forEach(function (s) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'twl-tab' + (s.key === activeStatus ? ' active' : '');
      btn.textContent = s.label;
      btn.addEventListener('click', function () {
        activeStatus = s.key;
        renderStatusTabs();
        renderPanel();
      });
      statusTabsEl.appendChild(btn);
    });
  }

  function renderGroupTabs() {
    groupTabsEl.innerHTML = '';
    groupTabsEl.style.display = 'flex';
    GROUPS.forEach(function (g) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'twl-tab' + (g.key === activeGroup ? ' active' : '');
      btn.textContent = g.label;
      btn.addEventListener('click', function () {
        activeGroup = g.key;
        renderGroupTabs();
        renderPanel();
      });
      groupTabsEl.appendChild(btn);
    });
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    tabsEl.style.display = 'flex';
    CATEGORIES.forEach(function (cat) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'twl-tab' + (cat.key === activeKey ? ' active' : '');
      btn.textContent = cat.label;
      btn.addEventListener('click', function () {
        activeKey = cat.key;
        renderTabs();
        renderPanel();
      });
      tabsEl.appendChild(btn);
    });
  }

  function renderPanel() {
    var cat = CATEGORIES.filter(function (c) { return c.key === activeKey; })[0];
    var group = GROUPS.filter(function (g) { return g.key === activeGroup; })[0];
    var list = (leaderboards[activeGroup] && leaderboards[activeGroup][activeStatus] && leaderboards[activeGroup][activeStatus][cat.key]) || [];

    bodyEl.innerHTML = '';

    var statusLabel = activeStatus !== 'All' ? ' · ' + activeStatus : '';
    var title = document.createElement('p');
    title.className = 'twl-panel-title';
    title.textContent = group.label + statusLabel + ' · ' + cat.label + ' (All-Time) — ' + list.length + (list.length === 1 ? ' person' : ' people');
    bodyEl.appendChild(title);

    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'twl-state';
      var dependsOnUnpublishedData = !formerDataAvailable && (activeStatus !== 'Active' || cat.key === 'Merit Badges');
      if (dependsOnUnpublishedData) {
        var whatsMissing = cat.key === 'Merit Badges' ? 'Merit Badges hasn\u2019t been published yet.' : 'Former-member data hasn\u2019t been published yet.';
        var howToFix = hasAdminAccess ? ' See the admin panel below.' : ' Ask a troop leader to publish it.';
        empty.textContent = whatsMissing + howToFix;
      } else {
        empty.textContent = 'No one matches this view for ' + cat.label.toLowerCase() + '.';
      }
      bodyEl.appendChild(empty);
      return;
    }

    var max = list[0].value || 1;
    var ul = document.createElement('ul');
    ul.className = 'twl-list';

    list.forEach(function (item, i) {
      var li = document.createElement('li');
      li.className = 'twl-row';

      var rank = document.createElement('div');
      rank.className = 'twl-rank';
      rank.textContent = (i + 1);

      var nameWrap = document.createElement('div');
      nameWrap.className = 'twl-name-wrap';
      var nameEl = document.createElement('div');
      nameEl.className = 'twl-name';
      nameEl.textContent = item.name;
      var track = document.createElement('div');
      track.className = 'twl-bar-track';
      var fill = document.createElement('div');
      fill.className = 'twl-bar-fill';
      fill.style.width = Math.max(3, (item.value / max) * 100) + '%';
      track.appendChild(fill);
      nameWrap.appendChild(nameEl);
      nameWrap.appendChild(track);

      var val = document.createElement('div');
      val.className = 'twl-value';
      val.textContent = formatVal(item.value);
      var unit = document.createElement('span');
      unit.textContent = cat.unit;
      val.appendChild(unit);

      li.appendChild(rank);
      li.appendChild(nameWrap);
      li.appendChild(val);
      ul.appendChild(li);
    });

    bodyEl.appendChild(ul);
  }

  // ---- Admin snapshot generator ---------------------------------------

  function parseRosterRecords(rows) {
    var headers = rows[0];
    var adultCol = headers.indexOf('Adult');
    var nameCol = headers.indexOf('Name');
    var leftCol = headers.indexOf('Left Unit');
    var byName = {};

    for (var i = 1; i < rows.length; i++) {
      var row = rows[i];
      var name = row[nameCol];
      if (!name) continue;
      var group = (adultCol !== -1 && row[adultCol] === 'Y') ? 'Adult' : 'Scout';
      var status = (leftCol !== -1 && row[leftCol]) ? 'Former' : 'Active';
      var values = {};
      CATEGORIES.forEach(function (cat) {
        if (!cat.rosterCol) return;
        var idx = headers.indexOf(cat.rosterCol);
        if (idx === -1) return;
        var val = parseFloat(row[idx]);
        if (!isNaN(val)) values[cat.key] = val;
      });
      byName[name] = { name: name, group: group, status: status, values: values };
    }
    return byName;
  }

  function mergeEventValuesIntoRoster(byName, eventRows) {
    eventRows.forEach(function (row) {
      if (!row) return;
      var rowType = row[ROW_TYPE_COL];
      if (rowType !== 'Scout' && rowType !== 'Adult') return;
      var name = row[NAME_COL];
      if (!name) return;

      var rec = byName[name];
      if (!rec) {
        // Present in event history but not in the roster export —
        // status unknown, default to Active (safer under-count of
        // "Former" than a wrong guess).
        rec = { name: name, group: rowType, status: 'Active', values: {} };
        byName[name] = rec;
      }

      CATEGORIES.forEach(function (cat) {
        if (cat.rosterCol) return; // already covered from the roster export
        var val = parseFloat(row[cat.col]);
        if (isNaN(val)) return;
        rec.values[cat.key] = val;
      });
    });
  }

  // Checks whether the current viewer can access the roster export,
  // WITHOUT downloading or reading its (sensitive) contents. A real
  // success response carries a Content-Disposition: attachment header;
  // a permission failure typically comes back as an HTML login/denied
  // page instead, which won't have that header. The body is cancelled
  // immediately either way so the sensitive payload is never pulled
  // down for viewers who are just being checked, not granted access.
  function checkRosterAccess() {
    return fetch(ROSTER_REPORT_URL, { credentials: 'include' })
      .then(function (res) {
        var disposition = (res.headers.get('content-disposition') || '').toLowerCase();
        var hasAccess = res.ok && disposition.indexOf('attachment') !== -1;
        if (res.body && res.body.cancel) { res.body.cancel(); }
        return hasAccess;
      })
      .catch(function () { return false; });
  }

  function getSelfPageIds() {
    var params = new URLSearchParams(window.location.search);
    return {
      menuItemId: params.get('Menu_Item_ID'),
      customFormId: params.get('Custom_Form_ID')
    };
  }

  function fetchCurrentSectionSource(menuItemId, customFormId) {
    var fd = new FormData();
    fd.append('menuopenflag', 'N');
    fd.append('Selected_Action', 'EditSectionSource');
    fd.append('Hover_Action', '');
    fd.append('Selected_Button_ID', '');
    fd.append('Menu_Item_ID', menuItemId);
    fd.append('Form_ID', SELF_FORM_ID);
    fd.append('Link_To_Menu_Item_ID', '');
    fd.append('Pass', '1');
    fd.append('Stack', '1');
    fd.append('NextSectionPageNumber', '');
    fd.append('NewRowsPerPage', '');
    fd.append('ChildRowID', '0');
    fd.append('Report_Format', '');
    fd.append('Current_URL', location.origin + '/formCustomEdit.aspx?Menu_Item_ID=' + menuItemId + '&Form_ID=' + SELF_FORM_ID + '&Custom_Form_ID=' + customFormId);
    fd.append('Page_Layout', '1');
    fd.append('Report_option', '2');
    fd.append('SelectedSectionID', SELF_SECTION_ID);
    fd.append('WidgetType', '131');
    fd.append('WidgetMaximumRows', '10');
    fd.append('MaximumWidth', '160');
    fd.append('MaximumHeight', '200');
    fd.append('BackgroundColorSelect', 'none');
    fd.append('BackgroundColorText', '#ffffff');
    fd.append('Custom_Form_ID', customFormId);
    fd.append('FirstControl', '');

    return fetch('formCustomEdit.aspx', { method: 'POST', credentials: 'include', body: fd })
      .then(function (res) {
        if (!res.ok) throw new Error('could not open section for editing (status ' + res.status + ')');
        return res.text();
      })
      .then(function (html) {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var ta = doc.getElementById('SectionTextContent');
        if (!ta) throw new Error('could not find this page\u2019s current saved content in the response \u2014 SELF_SECTION_ID may be wrong');
        return ta.value;
      });
  }

  function replaceSnapshotLines(sourceText, dateStr, dataArr) {
    var newDateLine = 'var FORMER_SNAPSHOT_DATE = ' + JSON.stringify(dateStr) + ';';
    var newDataLine = 'var FORMER_SNAPSHOT_DATA = ' + JSON.stringify(dataArr) + ';';
    if (!/var\s+FORMER_SNAPSHOT_DATE\s*=/.test(sourceText) || !/var\s+FORMER_SNAPSHOT_DATA\s*=/.test(sourceText)) {
      throw new Error('could not find FORMER_SNAPSHOT_DATE/FORMER_SNAPSHOT_DATA lines in the current saved content \u2014 refusing to save to avoid corrupting the page');
    }
    var updated = sourceText.replace(/var\s+FORMER_SNAPSHOT_DATE\s*=.*/, newDateLine);
    updated = updated.replace(/var\s+FORMER_SNAPSHOT_DATA\s*=.*/, newDataLine);
    return updated;
  }

  function saveSectionSource(menuItemId, customFormId, newContent) {
    var fd = new FormData();
    fd.append('menuopenflag', 'N');
    fd.append('Selected_Action', 'SaveContentEdit');
    fd.append('Hover_Action', '');
    fd.append('Selected_Button_ID', '');
    fd.append('Menu_Item_ID', menuItemId);
    fd.append('Form_ID', SELF_FORM_ID);
    fd.append('Link_To_Menu_Item_ID', '');
    fd.append('Pass', '1');
    fd.append('Stack', '1');
    fd.append('NextSectionPageNumber', '');
    fd.append('NewRowsPerPage', '');
    fd.append('ChildRowID', '0');
    fd.append('Report_Format', '');
    fd.append('Current_URL', location.origin + '/formCustomEdit.aspx');
    fd.append('Page_Layout', '1');
    fd.append('Report_option', '2');
    fd.append('Custom_Form_ID', customFormId);
    fd.append('SelectedSectionID', SELF_SECTION_ID);
    fd.append('SectionTextContent', newContent);
    fd.append('FirstControl', '');

    return fetch('formCustomEdit.aspx', { method: 'POST', credentials: 'include', body: fd })
      .then(function (res) {
        if (!res.ok) throw new Error('save failed (status ' + res.status + ')');
        return res.text();
      });
  }

  function renderAdminPanel() {
    adminSlotEl.innerHTML = '';
    var details = document.createElement('details');
    details.className = 'twl-admin-panel';
    var summary = document.createElement('summary');
    summary.textContent = 'Admin: Publish former member data';
    details.appendChild(summary);

    var note = document.createElement('p');
    note.className = 'twl-admin-note';
    note.textContent = 'Current members are already live for everyone for 6 of 7 categories \u2014 this publishes data for people who\u2019ve left, PLUS Merit Badges for everyone (active scouts included), since not every viewer has access to a live source for that one. Pulls only name + the needed metric values \u2014 no addresses, medical info, or other sensitive fields ever leave this action. Only someone with roster-export access can generate this. After generating, either click "Save this to the page now" to publish it automatically, or copy the code and paste it over FORMER_SNAPSHOT_DATE / FORMER_SNAPSHOT_DATA near the top of this page\u2019s script yourself.';
    details.appendChild(note);

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Generate';
    details.appendChild(btn);

    var errorP = document.createElement('p');
    errorP.className = 'twl-admin-error';
    errorP.style.display = 'none';
    details.appendChild(errorP);

    var textarea = document.createElement('textarea');
    textarea.rows = 8;
    textarea.readOnly = true;
    textarea.style.display = 'none';
    details.appendChild(textarea);

    var selfIds = getSelfPageIds();
    var canAutoSave = !!(selfIds.menuItemId && selfIds.customFormId);
    var saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.textContent = 'Save this to the page now';
    saveBtn.style.display = 'none';
    saveBtn.style.marginLeft = '8px';
    details.appendChild(saveBtn);

    var saveStatusP = document.createElement('p');
    saveStatusP.className = 'twl-admin-note';
    saveStatusP.style.display = 'none';
    details.appendChild(saveStatusP);

    var pendingStamp = null;
    var pendingList = null;

    saveBtn.addEventListener('click', function () {
      if (!pendingList) return;
      var ok = window.confirm(
        'This will overwrite this Custom Page\u2019s saved content (section ' + SELF_SECTION_ID + ') with refreshed former-member data. ' +
        'Only the FORMER_SNAPSHOT_DATE/FORMER_SNAPSHOT_DATA lines change \u2014 everything else, including live Active data, is copied through as-is. Continue?'
      );
      if (!ok) return;

      saveBtn.disabled = true;
      saveStatusP.style.display = 'block';
      saveStatusP.style.color = '';
      saveStatusP.textContent = 'Fetching this page\u2019s current saved content…';

      fetchCurrentSectionSource(selfIds.menuItemId, selfIds.customFormId)
        .then(function (currentSource) {
          saveStatusP.textContent = 'Saving…';
          var updated = replaceSnapshotLines(currentSource, pendingStamp, pendingList);
          return saveSectionSource(selfIds.menuItemId, selfIds.customFormId, updated);
        })
        .then(function () {
          saveStatusP.style.color = 'var(--moss)';
          saveStatusP.textContent = 'Saved. Reload this page to see the refreshed snapshot live for everyone.';
          saveBtn.disabled = false;
        })
        .catch(function (err) {
          saveStatusP.style.color = 'var(--ember)';
          saveStatusP.textContent = 'Auto-save failed (' + err.message + '). Use the copy/paste code above instead \u2014 nothing was changed.';
          saveBtn.disabled = false;
        });
    });

    btn.addEventListener('click', function () {
      errorP.style.display = 'none';
      textarea.style.display = 'none';
      saveBtn.style.display = 'none';
      saveStatusP.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Fetching roster export…';

      var byName;
      fetch(ROSTER_REPORT_URL, { credentials: 'include' })
        .then(function (res) {
          if (!res.ok) throw new Error('roster export status ' + res.status);
          return res.text();
        })
        .then(function (csvText) {
          var wb = XLSX.read(csvText, { type: 'string' });
          var sheet = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
          byName = parseRosterRecords(rows);

          btn.textContent = 'Fetching event participation report…';
          return submitDateRange();
        })
        .then(function () { return fetchEventWorkbook(); })
        .then(function (workbook) {
          mergeEventValuesIntoRoster(byName, eventWorkbookRows(workbook));

          // Former-status people are kept in full — Active data for
          // every OTHER category already comes from the live fetch, so
          // publishing those here would just be dead weight. Merit
          // Badges is the one exception: not every viewer has access to
          // a live source for it, so Active-status people are kept too,
          // but trimmed down to just their Merit Badges value.
          var list = Object.keys(byName)
            .map(function (n) { return byName[n]; })
            .map(function (rec) {
              if (rec.status === 'Former') return rec;
              var mb = rec.values ? rec.values['Merit Badges'] : undefined;
              if (typeof mb !== 'number' || mb <= 0) return null;
              return { name: rec.name, group: rec.group, status: rec.status, values: { 'Merit Badges': mb } };
            })
            .filter(function (rec) { return rec !== null; });

          var stamp = new Date().toLocaleString();
          var code = '  var FORMER_SNAPSHOT_DATE = ' + JSON.stringify(stamp) + ';\n' +
                     '  var FORMER_SNAPSHOT_DATA = ' + JSON.stringify(list) + ';';
          textarea.value = code;
          textarea.style.display = 'block';
          textarea.focus();
          textarea.select();

          pendingStamp = stamp;
          pendingList = list;
          if (canAutoSave) {
            saveBtn.style.display = 'inline-block';
          } else {
            saveStatusP.style.display = 'block';
            saveStatusP.style.color = '';
            saveStatusP.textContent = 'Auto-save isn\u2019t available in this context (couldn\u2019t read Menu_Item_ID/Custom_Form_ID from the page URL) \u2014 use the copy/paste code above.';
          }

          btn.disabled = false;
          btn.textContent = 'Generate';
        })
        .catch(function (err) {
          errorP.textContent = 'Could not generate former-member data (' + err.message + '). This usually means your account doesn\u2019t have roster-export permission — that\u2019s expected for most people.';
          errorP.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Generate';
        });
    });

    adminSlotEl.appendChild(details);
  }

  // ---- Boot -------------------------------------------------------------

  leaderboards = emptyLeaderboardShell();
  var formerNames = buildFormerNameSet(FORMER_SNAPSHOT_DATA);

  submitDateRange()
    .then(function () {
      if (stateEl) stateEl.textContent = 'Downloading the summary report…';
      return fetchEventWorkbook();
    })
    .then(function (eventWorkbook) {
      if (stateEl) stateEl.textContent = 'Checking permissions…';
      return checkRosterAccess().then(function (hasAccess) {
        return [eventWorkbook, hasAccess];
      });
    })
    .then(function (results) {
      var eventWorkbook = results[0];
      hasAdminAccess = results[1];

      addLiveDataToActive(leaderboards, eventWorkbook, formerNames);
      addSnapshotDataToLeaderboards(leaderboards, FORMER_SNAPSHOT_DATA);
      fillAllFromActiveAndFormer(leaderboards);
      sortAll(leaderboards);

      var badge = formerDataAvailable
        ? '<span class="twl-badge live">Active: Live</span><span class="twl-badge snapshot">Former: Snapshot</span>'
        : '<span class="twl-badge live">Live · Active Members</span>';
      subtitleEl.innerHTML = 'Full troop history, ' + START_DATE + ' – ' + END_DATE + badge;
      footerEl.textContent = 'Active updated ' + new Date().toLocaleString() +
        (formerDataAvailable
          ? '  ·  former members from snapshot dated ' + (FORMER_SNAPSHOT_DATE || 'an earlier date')
          : '  ·  former members not yet published' + (hasAdminAccess ? ' — see admin panel below' : ''));

      renderStatusTabs();
      renderGroupTabs();
      renderTabs();
      renderPanel();
      if (hasAdminAccess) renderAdminPanel();
    })
    .catch(function (err) {
      console.error('[Troop Leaderboards]', err);
      setState('Error loading the report: ' + err.message + '. If this persists, confirm your role still has the "View Event Participation Reports" permission, and check MENU_ITEM_ID/FORM_ID values at the top of this script.', true);
    });
})();
</script>
